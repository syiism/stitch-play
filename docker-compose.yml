# docker-compose.yml · StitchPlay 一键容器化
#
# 用法：
#   1.（可选）准备 .env 或直接 export 指定真实上游地址，让 /mf 同源代理可用：
#        STITCH_UPSTREAM_MF=http://mu.98tx.cn
#   2. 启动：docker compose up -d --build
#   3. 访问：http://localhost:8099  （swipe UI：http://localhost:8099/swipe.html）
#
# 说明：
#   - 上游地址为「可选」注入：不配置也能启动，且前端可正常切换数据源
#     （前端已支持无 baseUrl 切源）；仅 /mf 同源代理暂不可用，主队列会因
#     拉取失败而单独提示「在源设置填写 baseUrl」。需要真实数据后再补齐上游即可。
#   - 若想用配置文件形态（而不是环境变量），取消下方 volumes 注释并挂载你自己的 config.json。
#   - server.py 监听 0.0.0.0，容器内端口固定 8099，宿主侧端口用 ports 映射。

services:
  stitch-play:
    build: .
    image: stitch-play:latest
    container_name: stitch-play
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      # 未提供时为空字符串（不报错）：允许无上游启动
      STITCH_UPSTREAM_MF: "${STITCH_UPSTREAM_MF:-}"
    # 可选：用配置文件形态覆盖模板（与 environment 二选一）
    # volumes:
    #   - ./config.json:/app/config.json:ro